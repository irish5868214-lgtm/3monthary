<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey Babe!</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Pyidaungsu&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --envelope-w: 320px;
            --envelope-h: 220px;
            --flap-h: 115px;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f1f1;
            margin: 0;
            font-family: 'Indie Flower', cursive;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; /* အသည်းပုံလေးတွေ ဘေးထွက်ပြီး scroll bar မပေါ်စေရန် */
            position: relative;
        }

        /* နောက်ခံအသည်းပုံလေးများ ဖြာကျနေစေရန် CSS */
        .falling-hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* စာအိတ်ကို နှိပ်ရာမှာ အနှောင့်အယှက်မဖြစ်စေရန် */
            z-index: 0;
            overflow: hidden;
        }

        .falling-heart {
            position: absolute;
            top: -10%;
            color: #e63946;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* နေရာတည်ငြိမ်အောင် Container တစ်ခုတည်းထဲ ထည့်ထားပါတယ် */
        .card-container {
            position: relative;
            width: var(--envelope-w);
            height: calc(var(--envelope-h) + 120px); /* စာပွင့်ဖို့ နေရာအကျယ်အဝန်း */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* စာအိတ်ကို အောက်ခြေမှာ ကပ်ထားမယ် */
            align-items: center;
            z-index: 1;
        }

        /* Hey ! စာသားကို စာအိတ်အပေါ်နားလေးတင် ကပ်ထားပြီး 
           z-index: 1 ပေးထားလို့ စာအိတ်ပွင့်လာရင် စာရွက်အောက် ရောက်သွားပါမယ် */
        .header-text {
            position: absolute;
            bottom: calc(var(--envelope-h) + 10px); /* စာအိတ်အထက် ၁၀ ပစ်ဆယ်အကွာမှာ ကပ်ထားတာပါ */
            font-size: clamp(24px, 6vw, 40px);
            color: #333;
            text-align: center;
            z-index: 1; 
            margin: 0;
            transition: opacity 0.3s ease;
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            width: 100%;
            height: var(--envelope-h);
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #f0707c;
            border-radius: 8px;
            z-index: 2; /* Hey စာသားထက် အပေါ်ရောက်စေရန် */
        }

        /* စာအိတ်အဖုံး (Top Flap) */
        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            z-index: 5;
            border-top: var(--flap-h) solid #f68c96; 
            border-left: calc(var(--envelope-w) / 2) solid transparent;
            border-right: calc(var(--envelope-w) / 2) solid transparent;
            transform-origin: top;
            transition: transform 0.4s ease, z-index 0.2s ease;
        }

        /* စာအိတ်ကိုယ်ထည် (Front Side) */
        .envelope::after {
            content: "";
            position: absolute;
            z-index: 4;
            width: 0;
            height: 0;
            border-top: calc(var(--envelope-h) / 2) solid transparent;
            border-left: calc(var(--envelope-w) / 2) solid #f6a1aa;
            border-right: calc(var(--envelope-w) / 2) solid #f6a1aa;
            border-bottom: calc(var(--envelope-h) / 2) solid #f6a1aa;
            bottom: 0;
            border-radius: 0 0 8px 8px;
        }

        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: #d12d3c;
            z-index: 6;
            clip-path: path('M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402m5.726-20.583c-2.203 0-4.446 1.042-5.726 3.238-1.285-2.206-3.522-3.248-5.719-3.248-3.183 0-6.281 2.187-6.281 6.191 0 4.661 5.571 9.429 12 15.809 6.43-6.38 12-11.147 12-15.809 0-4.011-3.095-6.181-6.274-6.181');
            transition: opacity 0.3s;
        }

        .letter {
            position: absolute;
            bottom: 5px;
            left: 5%;
            width: 90%;
            height: 85%;
            background: white;
            padding: 15px;
            box-sizing: border-box;
            z-index: 3; /* စာအိတ်အောက်ထဲမှာ ပုန်းနေမယ် */
            transition: transform 0.5s ease, height 0.5s ease;
            border-radius: 5px;
            font-family: 'Pyidaungsu', serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
        }

        .letter p {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            margin: 0;
            word-break: break-word;
            text-align: left;
        }

        /* ဖွင့်လိုက်တဲ့အချိန် အကျိုးသက်ရောက်မှု */
        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 2; /* အဖုံးပွင့်သွားရင် စာရွက်နောက် ရောက်သွားမယ် */
        }

        /* စာရွက်အပေါ်တက်လာပြီး Hey စာသားကို ဖုံးအုပ်သွားစေရန် z-index မြှင့်လိုက်ပါတယ် */
        .envelope-wrapper.open .letter {
            transform: translateY(-130px); 
            z-index: 10; /* ထိပ်ဆုံးကို ပို့လိုက်လို့ Hey စာသားကို ဖုံးသွားပါမယ် */
            height: 240px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .envelope-wrapper.open .heart {
            opacity: 0;
            pointer-events: none;
        }

        .footer-text {
            font-size: 18px;
            margin-top: 20px;
            color: #777;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Mobile Screens */
        @media (max-width: 360px) {
            :root {
                --envelope-w: 280px;
                --envelope-h: 190px;
                --flap-h: 100px;
            }
            .card-container {
                height: calc(var(--envelope-h) + 100px);
            }
            .header-text {
                bottom: calc(var(--envelope-h) + 5px);
            }
            .envelope-wrapper.open .letter {
                transform: translateY(-110px);
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- နောက်ခံအသည်းပုံလေးများ ထည့်ရန်နေရာ -->
    <div class="falling-hearts-container" id="heartsContainer"></div>

    <audio id="bgm" loop>
        <source src="latt.mp3" type="audio/mpeg">
    </audio>

    <script>
        window.addEventListener("click", () => {
            const music = document.getElementById("bgm");
            music.play();
        }, { once: true });
    </script>

    <!-- တည်ဆောက်ပုံကို ပိုမိုကျစ်လျစ်အောင် ပြင်ဆင်ထားပါတယ် -->
    <div class="card-container">
        <div class="header-text">Hey Pouk Sa layy !</div>

        <div class="envelope-wrapper" onclick="toggleLetter()">
            <div class="envelope">
                <div class="heart"></div>
                <div class="letter">
                    <p>Happy 3 monthsary ပါ ​မောင်​မောင်​ရေ🙊 <br><br>

&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;မမဆိုးသမျှ သည်းခံ​ပေးတယ် မမ စိတ်​ကောက်လဲ စိတ်ရှည်"နဲ့ ​ချော့ပြီး အလိုက်သိ​ပေးလို့ ​မောင်​မောင့်ကို ​ကျေးဇူးအများကြီးတင်ပါတယ်​နော် ​​ရှေ့​လျှောက်လဲ အများကြီး ချစ်​ပေးဖို့ မျှော်လင့်ပါတယ် ​ပေါက်စ​လေး​ရေ 🐣💕</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-text">you've got a new message</div>

    <script>
        function toggleLetter() {
            document.querySelector('.envelope-wrapper').classList.toggle('open');
        }

        // အသည်းပုံအနီလေးများ ဖြာကျစေသည့် Script
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.innerHTML = '❤';

            // ကျပန်း နေရာ၊ အရွယ်အစား၊ ကျဆင်းနှုန်းနှင့် အရောင်အနုအရင့် သတ်မှတ်ခြင်း
            heart.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 16 + 10; // 10px မှ 26px အတွင်း
            heart.style.fontSize = size + 'px';

            const duration = Math.random() * 4 + 4; // 4 စက္ကန့်မှ 8 စက္ကန့်အတွင်း
            heart.style.animationDuration = duration + 's';

            const redShades = ['#d12d3c', '#e63946', '#ff4d6d', '#c9184a', '#ff758f'];
            heart.style.color = redShades[Math.floor(Math.random() * redShades.length)];

            container.appendChild(heart);

            // အောက်ခြေရောက်ပြီးလျှင် ပြန်ဖျက်ပေးခြင်း (စက်မလေးစေရန်)
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // 0.35 စက္ကန့်တိုင်း အသည်းပုံတစ်ခုစီ ဖန်တီးပေးမည်
        setInterval(createHeart, 350);
    </script>

</body>
</html>
